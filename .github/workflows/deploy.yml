name: Deploy contest-winrate to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: contest-winrate/pnpm-lock.yaml

      - name: Install dependencies and build
        working-directory: contest-winrate
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          ls -la dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: contest-winrate/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
