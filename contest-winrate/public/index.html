<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>コンテスト勝率計算機（Standalone）</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #18202c;
    }
    .wrap { max-width: 1120px; margin: 0 auto; }
    .panel {
      background: #fff;
      border: 1px solid #dce2ec;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; }
    .controls label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: #526071; font-weight: 600; }
    .controls input { width: 120px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    button { padding: 9px 18px; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.primary { background: #2563eb; color: #fff; }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 18px; margin-bottom: 18px; }
    .stage-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #fafbfd; }
    .stage-card:last-child { margin-bottom: 0; }
    .stage-title { font-size: 0.88rem; font-weight: 700; color: #334155; }
    .slot-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .slot-row span { width: 42px; font-size: 0.8rem; color: #64748b; }
    .slot-row input { flex: 1; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; }
    .bar-bg { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .bar-fill { height: 100%; width: 0%; background: #2563eb; transition: width 0.15s ease; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; white-space: pre-wrap; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 0.9rem; }
    th, td { border: 1px solid #dce2ec; padding: 8px 10px; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { background: #f1f5f9; }
    .kpi { font-size: 1.25rem; font-weight: 700; color: #1d4ed8; }
    .sub { font-size: 0.88rem; color: #475569; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>コンテスト勝率予想</h1>
    <div class="panel controls">
      <label>試行回数 (N)
        <input id="trials" type="number" min="1" max="50000" value="500" />
      </label>
      <label>シード基準 (A)
        <input id="seedA" type="number" value="10000" />
      </label>
      <label>シード基準 (B)
        <input id="seedB" type="number" value="900000" />
      </label>
      <button id="runBtn" class="primary" type="button">計算開始</button>
      <button id="exportBtn" class="secondary" type="button" disabled>結果JSON保存</button>
    </div>

    <div id="errorBox" class="error"></div>

    <div class="grid-2">
      <div class="panel">
        <h2 style="margin: 0 0 12px; font-size: 1rem; color: #1d4ed8;">左側（A）— 3ステージ×3枠URL</h2>
        <div id="inputsA"></div>
      </div>
      <div class="panel">
        <h2 style="margin: 0 0 12px; font-size: 1rem; color: #dc2626;">右側（B）— 3ステージ×3枠URL</h2>
        <div id="inputsB"></div>
      </div>
    </div>

    <div class="panel">
      <div id="statusText">待機中</div>
      <div class="bar-bg"><div id="progressBar" class="bar-fill"></div></div>
    </div>

    <div id="resultPanel" class="panel" style="display: none;">
      <div id="kpiMain" class="kpi"></div>
      <div id="kpiSub" class="sub"></div>
      <table>
        <thead>
          <tr>
            <th>ステージ</th>
            <th>A 勝率</th>
            <th>A 平均スコア</th>
            <th>A SD</th>
            <th>B 平均スコア</th>
            <th>B SD</th>
          </tr>
        </thead>
        <tbody id="stageBody"></tbody>
      </table>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
